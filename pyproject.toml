[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sightline"
version = "0.1.0"
description = "Post-hoc visual retrofitting research repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch==2.13.0+cu130",
  "transformers==5.12.1",
  "tokenizers==0.22.2",
  "safetensors==0.8.0",
  "numpy==2.5.1",
  "huggingface-hub==1.25.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.1"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.hatch.build.targets.wheel]
packages = ["src/sightline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]