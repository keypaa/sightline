<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2a calibration review</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #16191f;
    --panel-2: #1d2129;
    --matte: #1a1d22;
    --line: #262b34;
    --text: #eceef2;
    --muted: #98a1b0;
    --dim: #697283;
    --accent: #4c8dff;
    --ok: #35a97a;
    --bad: #cf4b44;
    --warn: #c08f34;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- chrome ---- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px 24px;
    align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: rgba(14, 16, 19, 0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .title { display: flex; align-items: baseline; gap: 12px; }
  .title h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .title span { color: var(--dim); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12.5px; line-height: 1;
    padding: 8px 13px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button:hover { color: var(--text); border-color: #39414f; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #5f9bff; border-color: #5f9bff; color: #fff; }
  button.danger:hover { color: #f0b3ad; border-color: var(--bad); }
  .progress {
    font-size: 12.5px; color: var(--dim);
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }
  .progress b { color: var(--text); font-weight: 600; }

  /* ---- layout ---- */
  main {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 20px 64px;
    max-width: 1500px;
    margin: 0 auto;
  }
  .card {
    display: grid;
    grid-template-columns: minmax(300px, 380px) 1fr;
    gap: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid transparent;
    border-radius: var(--radius);
    padding: 16px 20px;
    align-items: start;
  }
  .card[data-verdict="contradicted"] { border-left-color: var(--bad); }
  .card[data-verdict="supported"] { border-left-color: var(--ok); }
  .card[data-verdict="unsure"] { border-left-color: var(--warn); }
  .card[data-verdict="mixed"] { border-left-color: #7a6ce0; }

  /* ---- image ---- */
  .image {
    background: var(--matte);
    border-radius: 6px;
    display: block;
    height: 260px;
    width: 100%;
    overflow: hidden;
  }
  .image img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .noimg { color: var(--dim); font-size: 12px; }

  /* ---- body ---- */
  .body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .type, .tag {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 3px 8px; border-radius: 4px;
  }
  .type { background: #1f2a37; color: #8fb6d8; }
  .tag-planted { background: #3a2e10; color: #d8ac4c; }
  .tag-supported { background: #16402a; color: #6fdc9f; }
  .tag-contradicted { background: #4a1d1a; color: #f4948c; }
  .tag-unsure { background: #3b3419; color: #dcb96a; }
  .tag-mixed { background: #2c2650; color: #b0a4ff; }
  .idx {
    margin-left: auto; color: var(--dim);
    font-size: 11.5px; font-variant-numeric: tabular-nums;
  }

  .claim {
    margin: 0;
    font-size: 17px; font-weight: 600; line-height: 1.35;
    letter-spacing: -0.005em;
  }

  /* ---- verdicts ---- */
  .verdicts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .verdicts li {
    display: grid;
    grid-template-columns: auto 132px minmax(0, 1fr);
    align-items: baseline;
    gap: 4px 14px;
    font-size: 12.5px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .verdicts li:first-child { border-top: 0; padding-top: 2px; }
  .verdicts .model { color: #8d97a8; font-size: 11.5px; letter-spacing: 0.01em; }
  .verdicts .evidence { color: var(--muted); font-size: 12.5px; line-height: 1.5; min-width: 0; }

  /* ---- decision ---- */
  .decision { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .decision .prompt {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); font-weight: 600; margin-right: 2px;
  }
  .decision button {
    flex: 0 0 auto;
    min-width: 150px;
    padding: 10px 14px;
    font-size: 13px;
    background: transparent;
  }
  .decision .agree { color: #79c9a3; border-color: #2c4a3b; }
  .decision .agree:hover { background: #16301f; color: #9ae0bd; border-color: var(--ok); }
  .decision .wrong { color: #e19a94; border-color: #4a2b29; }
  .decision .wrong:hover { background: #31100e; color: #f0b3ad; border-color: var(--bad); }
  .card[data-decision="right"] .agree { background: var(--ok); border-color: var(--ok); color: #fff; }
  .card[data-decision="wrong"] .wrong { background: var(--bad); border-color: var(--bad); color: #fff; }

  footer { padding: 16px 20px 48px; color: var(--dim); font-size: 11.5px; max-width: 1600px; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>M2a calibration review</h1>
    <span>Decisions are recorded per claim.</span>
  </div>
  <div class="controls">
    <span class="progress"><b id="done">0</b> / <span id="total">0</span> reviewed</span>
    <button class="primary" onclick="exportJson()">Export decisions</button>
    <button onclick="setAll('right')">Mark all right</button>
    <button class="danger" onclick="setAll('wrong')">Mark all wrong</button>
    <button onclick="clearAll()">Clear</button>
  </div>
</header>
<main>
</main>
<footer>
  Decisions persist in this browser's local storage. <code>Export decisions</code> writes a JSON
  file to fold into the run record.
</footer>
<script>
const KEY = "m2a-review-decisions";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
  catch { return {}; }
}

function paint() {
  const decisions = load();
  const cards = [...document.querySelectorAll(".card")];
  let done = 0;
  for (const card of cards) {
    const k = `${card.dataset.id}:${card.dataset.turn}`;
    if (decisions[k]) { card.dataset.decision = decisions[k]; done++; }
    else { delete card.dataset.decision; }
  }
  document.getElementById("done").textContent = done;
  document.getElementById("total").textContent = cards.length;
}

function save(next) { localStorage.setItem(KEY, JSON.stringify(next)); paint(); }

function decide(id, turn, value) {
  const decisions = load();
  const k = `${id}:${turn}`;
  if (decisions[k] === value) { delete decisions[k]; } else { decisions[k] = value; }
  save(decisions);
}

function setAll(value) {
  const decisions = load();
  for (const card of document.querySelectorAll(".card")) {
    decisions[`${card.dataset.id}:${card.dataset.turn}`] = value;
  }
  save(decisions);
}

function clearAll() { localStorage.removeItem(KEY); paint(); }

function exportJson() {
  const rows = Object.entries(load()).map(([k, v]) => {
    const [id, turn] = k.split(":");
    return { image_id: Number(id), turn: Number(turn), decision: v };
  });
  const blob = new Blob([JSON.stringify({ decisions: rows }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "m2a_review_decisions.json";
  a.click();
}

document.addEventListener("click", (event) => {
  const button = event.target.closest(".decision button");
  if (!button) return;
  decide(button.dataset.id, button.dataset.turn, button.classList.contains("agree") ? "right" : "wrong");
});

paint();
</script>
</body>
</html>
