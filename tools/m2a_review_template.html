<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>M2a grounding set &mdash; spot-check</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #14161a; color: #e6e6e6;
         font: 14px/1.5 system-ui, sans-serif; }
  header { position: sticky; top: 0; background: #14161aee; backdrop-filter: blur(6px);
           padding: 12px 0; margin-bottom: 16px; border-bottom: 1px solid #2a2e35; z-index: 2; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: #1b1e24; border: 1px solid #2a2e35; border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; height: 200px; object-fit: contain; background: #0f1114; display: block; }
  .body { padding: 12px 14px 14px; }
  h2 { font-size: 13px; margin: 0 0 2px; word-break: break-all; color: #9aa4b2; font-weight: 500; }
  .meta { font-size: 11px; color: #6b7480; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #9aa4b2; font-weight: 500; padding: 2px 8px 2px 0; width: 38%; }
  .lic { font-size: 11px; color: #6b7480; margin: 8px 0; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer;
           padding: 8px; border-radius: 6px; background: #22262d; }
  .check input { margin-top: 2px; }
  button { background: #2f6feb; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px;
           font-size: 13px; cursor: pointer; }
  button.ghost { background: #2a2e35; }
  #status { font-size: 12px; color: #9aa4b2; }
</style></head><body>
<header>
  <h1>M2a grounding set &mdash; spot-check</h1>
  <div class="bar">
    <span id="status"></span>
    <button onclick="exportJson()">Export confirmed ids</button>
    <button class="ghost" onclick="markAll(true)">Confirm all shown</button>
    <button class="ghost" onclick="markAll(false)">Clear all</button>
  </div>
</header>
<main class="grid">
"""
        + "\n".join(cards)
        + """
</main>
<script>
const KEY = "m2a-grounding-confirmed";
const boxes = () => [...document.querySelectorAll('.check input')];
function load() {
  const saved = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
  boxes().forEach(b => { b.checked = saved.has(b.dataset.id); });
  update();
}
function persist() {
  const ids = boxes().filter(b => b.checked).map(b => b.dataset.id);
  localStorage.setItem(KEY, JSON.stringify(ids));
  update();
}
function update() {
  const total = boxes().length;
  const done = boxes().filter(b => b.checked).length;
  document.getElementById('status').textContent = `${done} / ${total} confirmed`;
}
function markAll(v) { boxes().forEach(b => b.checked = v); persist(); }
function exportJson() {
  const ids = boxes().filter(b => b.checked).map(b => Number(b.dataset.id));
  const blob = new Blob([JSON.stringify({confirmed_ids: ids}, null, 2)],
                        {type: "application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "confirmed_ids.json";
  a.click();
}
boxes().forEach(b => b.addEventListener('change', persist));
load();
</script>
</body></html>
